name: DeployGuard Bundle Stats

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]

jobs:
  bundle-stats:
    runs-on: ubuntu-latest
    name: Upload bundle stats for DeployGuard

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # We disabled cache: 'npm' here to prevent the action from crashing 
          # due to the missing root lock file.

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Vite App
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Bundle Stats
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: frontend/dist/stats.json   # Pointing directly to the frontend build output
          retention-days: 7
          if-no-files-found: warn
